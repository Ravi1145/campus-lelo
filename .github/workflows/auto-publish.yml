# Auto-publishing for scheduled blog guides.
#
# Guides in src/data/blog-posts/delhi-lead-guides.ts carry a `publishAt` date. src/data/blogs.ts includes a
# guide only once that date has passed at build time, so something must rebuild the site each day. This
# workflow calls a Vercel Deploy Hook once a day (06:00 IST).
#
# One-time setup (owner): Vercel project > Settings > Git > Deploy Hooks > create a hook for the main branch,
# then add its URL as a repository secret named VERCEL_DEPLOY_HOOK_URL
# (GitHub repo > Settings > Secrets and variables > Actions). Without the secret this workflow does nothing.
name: auto-publish
on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 06:00 IST
  workflow_dispatch: {}
jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK_URL is not set; nothing to do."; exit 0; fi
          curl -fsS -X POST "$HOOK" && echo "Deploy triggered"
